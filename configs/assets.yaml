# Asset pool for MessyKitchens-Synthetic.
#
# Every entry is one object. `split` decides which scenes may use it: train scenes draw only
# from `train` assets and val scenes only from `val` assets, so the split is by object id.
# To add assets from another source (OmniObject3D, RoboCasa, ...), add a `sources` entry with a
# fetcher and list the objects with that `source`. Only licences in `allowed_licences` pass.
#
# category drives the default physics density and stacking roles (see `categories`).
# Per-asset overrides: never_on_top, never_support, density or mass (kg; sets density from the
# proxy volume), com_offset (metres, in the original mesh frame, added to the computed
# solid-volume centre of mass), note.

allowed_licences:
  - CC-BY-4.0
  - CC0-1.0
  - MIT
  - Apache-2.0

# Assets that must never appear in training scenes (MessyKitchens-Real benchmark scans).
holdout:
  sources: [messykitchens_real]
  sha256_list: docs/messykitchens_benchmark_object_models_edc5482.json

sources:
  gso:
    fetcher: gazebo_fuel
    owner: GoogleResearch
    url: https://fuel.gazebosim.org/1.0/GoogleResearch/models/{name}.zip
    attribution: "Google Scanned Objects, Google Research (Downs et al., ICRA 2022)"

# density in kg/m^3 of the solid shell; roles used by the stacking/nesting planner.
categories:
  mug:      {density: 2300, container: true,  support: false, on_top: true}
  cup:      {density: 1500, container: true,  support: false, on_top: true}
  ramekin:  {density: 2300, container: true,  support: true,  on_top: true}
  bowl:     {density: 2300, container: true,  support: true,  on_top: true}
  plate:    {density: 2300, container: false, support: true,  on_top: true}
  saucer:   {density: 2300, container: false, support: true,  on_top: true}
  tray:     {density: 2300, container: false, support: true,  on_top: true}
  pan:      {density: 2700, container: true,  support: true,  on_top: true}
  dish:     {density: 2300, container: true,  support: true,  on_top: true}
  pot:      {density: 1500, container: false, support: true,  on_top: false}
  pitcher:  {density: 2300, container: false, support: false, on_top: false}
  teapot:   {density: 2300, container: false, support: false, on_top: false}
  kettle:   {density: 2000, container: false, support: false, on_top: false}
  box:      {density: 300,  container: false, support: true,  on_top: true}
  canister: {density: 500,  container: false, support: true,  on_top: true}
  jar:      {density: 800,  container: false, support: true,  on_top: true}
  bottle:   {density: 800,  container: false, support: false, on_top: false}

