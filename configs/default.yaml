# MessyKitchens-Synthetic generator configuration.
# Paths are relative to the repository root. Values marked (paper) come from arXiv 2603.16868
# §3.2 / App. C; everything else is our choice for what the paper leaves unspecified.

assets:
  config: configs/assets.yaml
  table: data/assets/processed/asset_table.json
  environment: data/environment/environment.json   # HDRIs + table materials (Poly Haven, CC0)

compat:                       # stacking / nesting compatibility (mksynth/compat.py)
  max_stack_area_ratio: 1.0   # paper: top-face bbox area must fit
  max_stack_volume_ratio: 1.0 # paper: volume must fit
  min_support_area: 0.004
  max_nest_volume_ratio: 0.9
  nest_clearance: 0.003
  min_inserted_fraction: 0.3

levels:
  easy:                       # paper: 4 objects placed or dropped on a plane, ~50% upright
    n_base: 4
    n_stack: 0
    n_nest: 0
    p_upright: 0.5
    placement: separated
    scene_radius: 0.22        # objects are placed inside this disc (m)
    min_gap: 0.0              # footprints may touch, so dropped objects occasionally lean on each other
                              # (real easy scenes have some contact: penetration/contact 0.072)
  medium:                     # paper: 4 jittered base objects + 2 stacked on top, kept only if stable
    n_base: 4
    n_stack: 2
    n_nest: 0
    p_upright: 0.5            # base objects that are not stack targets
    placement: jittered
    jitter: 0.08              # half-width of the (x, y) perturbation square; controls tightness
    min_gap: 0.003
    p_chain: 0.0              # probability that a stacked object goes on another stacked object
  hard:                       # paper: medium + several stacks and nests. Object count unspecified;
    n_base: 4                 # 8 matches MessyKitchens-Real hard scenes.
    n_stack: 2
    n_nest: 2
    p_upright: 0.5
    placement: jittered
    jitter: 0.07
    min_gap: 0.002
    p_chain: 0.3              # nest into a nested container / stack on a stacked object

placement:
  drop_height: [0.003, 0.02]  # base objects: lowest point this far above the table (m)
  stack_clearance: 0.004      # stacked objects: released this far above the support surface
  nest_clearance_z: 0.004     # nested objects: released this far above the predicted rest height
  p_stack_upright: 0.7
  nest_max_tilt_deg: 8
  stack_max_tilt_deg: 5
  max_support_tilt_deg: 15    # a support/container that tipped over cannot receive objects
  max_plan_tries: 50

physics:
  collision: coacd            # coacd | mesh | mesh_then_coacd. MESH (GImpact) glitched on nesting
                              # in our tests, so convex decomposition is the default (brief allows it).
  margin_object: 0.00001      # 0.01 mm (paper): margin of the frozen scan colliders, so gap between true surfaces
  part_margin: 0.0004         # convex parts are shrunk by this much (assets coacd.shrink) and get it back as margin
  margin_ground: 0.001        # 1.0 mm (paper)
  ground_mode: active_fixed   # paper: active body, fully constrained. Alternative: passive
  restitution: 0.0            # (paper)
  use_deactivation: false     # (paper) no velocity-based deactivation
  friction: [0.4, 0.8]        # sampled per object
  linear_damping: 0.04
  angular_damping: 0.3          # no rolling friction in Bullet; damping stops objects rolling forever
  fps: 24
  substeps_per_frame: 20      # 480 Hz
  solver_iterations: 10
  check_interval: 0.5         # s; settle checks run on this grid
  min_stage_time: 1.0
  max_stage_time: 6.0
  hold_time: 1.0              # extra simulation after settling; must not move during it
  settle_translation: 0.001   # max COM motion per check interval to count as settled (m)
  settle_rotation_deg: 1.0
  max_speed: 3.0              # m/s; faster means the solver exploded (glitch)
  fall_radius: 0.45           # COM farther than this from the scene centre = fell off the plane
  max_attempts: 8             # new layouts per scene before the scene is logged as failed
  # Stage k > 0 drops objects onto supports frozen as static meshes of their scans (exact surfaces;
  # convex parts bulge over cavities). Frozen supports cannot tip, so this static check stands in:
  tip_margin: 0.003           # combined COM of a support and its load must stay this far inside its base
  tip_base_tolerance: 0.003   # base = support vertices within this height of its lowest point
  # Final-state checks on the watertight proxies (each 0.4 mm outside its scan, so touching proxies
  # overlap by ~0.8 mm): reject deeper overlap, and stacked / nested objects not touching their parent.
  max_proxy_penetration: 0.002
  relation_contact_distance: 0.0025
  # A child resting on its own convex parts where they bridge a recess (a foot ring) hovers over
  # the parent's real surface; a proxy gap of 0.5 mm is ~1.3 mm between the scans.
  max_parent_gap: 0.0005

render:
  resolution: 512             # (paper)
  n_views: 10                 # (paper)
  keep_views: 6               # (paper) views used for training
  azimuth_deg: [0, 360]       # (paper)
  elevation_deg: [45, 90]     # (paper)
  fov_deg: [45, 65]           # sampled per scene
  frame_fill: 0.85            # all objects project inside this fraction of the half-image
  distance_scale: [1.0, 1.25]  # then the camera is pulled back by this random factor
  samples: 128
  noise_threshold: 0.01
  denoiser: auto              # INTEL (OIDN) | OPTIX | auto: OPTIX when rendering with OptiX, else INTEL
  threads: null               # CPU threads per Blender worker; null = generate.py splits the machine's CPU quota
  hdri_strength: [0.6, 1.5]
  p_extra_light: 0.5
  table_size: 8.0             # large enough that no view sees its edge
  p_plain_table: 0.15

annotate:
  min_visible_px: 200         # objects with fewer visible pixels are left out of the MOD mask
  contact_distance: 0.0025    # 2.5 mm (paper)
  surface_spacing: 0.001      # one surface sample per mm^2
  max_samples_per_object: 300000
  voxel_pitch: 0.001          # penetration voxel size
  ground_contact_tol: 0.0025
  max_penetration_depth: 0.002  # validate.py: deeper overlap fails the scene
  proxy_offset: 0.0004        # proxies are offset outward by this much (mksynth/assets/preprocess.py)

splits:
  val_seed_offset: 1000003    # val scenes use an independent seed stream

validate:                     # validate.py thresholds
  max_penetration_depth_mm: 2.0
  max_sink_mm: 1.0
  min_mask_agreement: 0.9    # Blender mask vs mask re-derived from gt_scene.glb + cameras (1-px tolerant)
  max_visible_outside_amodal: 0.05
  max_depth_error_mm: 2.0
  require_planned_relations: true
